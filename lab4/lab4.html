<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="card">
        <h2>Content</h2>
        <p>The content area holds the actual text. Its size is set by the width property.</p>
    </div>

    <div class="card">
        <h2>Padding</h2>
        <p>Padding is the space between the content and the border, inside the card.</p>
    </div>

    <div class="card">
        <h2>Margin</h2>
        <p>Margin is the space outside the border that separates the card from its neighbors.</p>
    </div>
</body>
</html>
